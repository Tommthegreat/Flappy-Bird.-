<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKETHO</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:#111;
height:100vh;
overflow:hidden;
}
#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#111;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
color:white;
z-index:9999;
}
#intro h1{
font-size:48px;
color:#00ff99;
}
#loading{
margin-top:20px;
font-size:18px;
color:#aaa;
animation:pulse 1s infinite;
}
@keyframes pulse{
0%{opacity:.3}
50%{opacity:1}
100%{opacity:.3}
}
#app{
display:none;
height:100vh;
flex-direction:column;
}
.header{
height:55px;
background:#1c1c1c;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
}
.logo{
font-size:24px;
font-weight:bold;
color:#00ff99;
}
.menuBtn{
font-size:28px;
cursor:pointer;
}
.menu{
position:absolute;
top:55px;
right:10px;
background:#222;
width:190px;
display:none;
flex-direction:column;
border-radius:12px;
overflow-y:auto;
max-height:70vh;
border:1px solid #444;
z-index:1000;
}
.menu button{
background:none;
color:white;
border:none;
padding:14px;
text-align:left;
border-bottom:1px solid #333;
}
.editorWrap{
flex:1;
display:flex;
overflow:hidden;
}
#lineNumbers{
background:#151515;
color:#666;
padding:10px 5px;
min-width:40px;
text-align:right;
font-size:15px;
line-height:24px;
overflow:hidden;
}
#editor{
flex:1;
background:#181818;
color:#00ff99;
border:none;
outline:none;
padding:10px;
font-size:15px;
line-height:24px;
resize:none;
}
.bottom{
height:60px;
background:#1c1c1c;
display:flex;
align-items:center;
justify-content:center;
gap:15px;
}
.bottom button{
background:#2d2d2d;
color:white;
border:none;
padding:10px 18px;
border-radius:10px;
}
#previewBox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
background:white;
z-index:99999;
}
#preview{
width:100%;
height:100%;
border:none;
}#fileInput{ display:none; } </style>

</head>
<body><div id="intro">
<h1>SKETHO</h1>
<div id="loading">Loading...</div>
</div><div id="app">
<div class="header">
<div class="logo">SKETHO</div>
<div class="menuBtn" onclick="toggleMenu()">⋮</div>
</div><div class="menu" id="menu">
<button onclick="newFile()">📄 New File</button>
<button onclick="openFile()">📂 Open File</button>
<button onclick="saveFile()">💾 Save File</button>
<button onclick="undoText()">↩ Undo</button>
<button onclick="redoText()">↪ Redo</button>
<button onclick="selectAllText()">🔵 Select All</button>
<button onclick="cutText()">✂ Cut</button>
<button onclick="copyText()">📋 Copy</button>
<button onclick="pasteText()">📥 Paste</button>
<button onclick="deleteText()">🗑 Delete</button>
<button onclick="findText()">🔍 Find</button>
<button onclick="goToLine()">📍 Go To Line</button>
</div><div class="editorWrap">
<div id="lineNumbers">1</div>
<textarea id="editor" placeholder="Write HTML here..."></textarea>
</div><div class="bottom">
<button onclick="runCode()">▶ Run</button>
<button onclick="clearEditor()">🧹 Clear</button>
</div>
</div><div id="previewBox"><iframe id="preview"></iframe>
</div><input type="file" id="fileInput" accept=".html,.txt"><script>
const intro=document.getElementById('intro');
const app=document.getElementById('app');
const editor=document.getElementById('editor');
const menu=document.getElementById('menu');
const preview=document.getElementById('preview');
const previewBox=document.getElementById('previewBox');
const lineNumbers=document.getElementById('lineNumbers');
const fileInput=document.getElementById('fileInput');

let undoStack=[];
let redoStack=[];

setTimeout(()=>{
intro.style.display='none';
app.style.display='flex';
},5000);

function toggleMenu(){
menu.style.display=menu.style.display==='flex'?'none':'flex';
}

function updateLines(){
const count=editor.value.split('\n').length;
let text='';
for(let i=1;i<=count;i++){
text+=i+'<br>';
}
lineNumbers.innerHTML=text;
}

editor.addEventListener('input',()=>{
undoStack.push(editor.value);
updateLines();
});

editor.addEventListener('scroll',()=>{
lineNumbers.scrollTop=editor.scrollTop;
});

function runCode(){
const code=editor.value;
if(code.trim()===''){
alert('Write some code');
return;
}

preview.srcdoc=code;
previewBox.style.display='block';

history.pushState({preview:true}, '');
}

function closePreview(){
previewBox.style.display='none';
}

window.addEventListener('popstate',()=>{
if(previewBox.style.display==='block'){
previewBox.style.display='none';
}
});

function clearEditor(){
editor.value='';
updateLines();
}

function newFile(){
editor.value='';
updateLines();
menu.style.display='none';
}

function openFile(){
fileInput.click();
menu.style.display='none';
}

fileInput.addEventListener('change',(e)=>{
const file=e.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=(ev)=>{
editor.value=ev.target.result;
updateLines();
};
reader.readAsText(file);
});

function saveFile(){
const blob=new Blob([editor.value],{type:'text/html'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='sketho.html';
a.click();
menu.style.display='none';
}

function undoText(){
if(undoStack.length>0){
redoStack.push(editor.value);
editor.value=undoStack.pop();
updateLines();
}
menu.style.display='none';
}

function redoText(){
if(redoStack.length>0){
undoStack.push(editor.value);
editor.value=redoStack.pop();
updateLines();
}
menu.style.display='none';
}

function selectAllText(){
editor.select();
menu.style.display='none';
}

function copyText(){
navigator.clipboard.writeText(editor.value);
menu.style.display='none';
}

function cutText(){
navigator.clipboard.writeText(editor.value);
editor.value='';
updateLines();
menu.style.display='none';
}

async function pasteText(){
const txt=await navigator.clipboard.readText();
editor.value+=txt;
updateLines();
menu.style.display='none';
}

function deleteText(){
editor.value='';
updateLines();
menu.style.display='none';
}

function findText(){
const txt=prompt('Find text');
if(!txt)return;
const index=editor.value.indexOf(txt);
if(index>=0){
editor.focus();
editor.setSelectionRange(index,index+txt.length);
}
menu.style.display='none';
}

function goToLine(){
const line=parseInt(prompt('Line number'));
if(!line)return;
const lines=editor.value.split('\n');
let pos=0;
for(let i=0;i<line-1;i++){
pos+=lines[i].length+1;
}
editor.focus();
editor.setSelectionRange(pos,pos);
menu.style.display='none';
}

window.onclick=(e)=>{
if(!e.target.closest('.menu')&&!e.target.closest('.menuBtn')){
menu.style.display='none';
}
};

updateLines();
</script></body>
</html>
